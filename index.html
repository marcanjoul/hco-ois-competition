<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>OIS Competition 🏆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- ── SCREEN: Name Picker ── -->
  <div id="screen-pick" class="screen active">
    <div class="pick-bg-stripe"></div>
    <div class="pick-inner">
      <div class="logo-lockup">
        <div class="logo-icon">🏆</div>
        <h1 class="logo-title store-name">OIS Competition</h1>
      </div>
      <div id="site-banner" class="site-banner" style="display:none;"></div>
      <div id="comp-selector-wrap" class="comp-selector-wrap">
        <label class="field-label">COMPETITION</label>
        <div id="comp-tabs" class="comp-tabs"></div>
      </div>
      <label class="field-label">WHO ARE YOU?</label>
      <div class="search-wrap">
        <input type="text" id="input-search-employees" class="log-input" placeholder="🔍 Search employees..." autocomplete="off" />
        <div id="search-results-info" class="search-results-info hidden"></div>
      </div>
      <div id="name-grid" class="name-grid"></div>
      <button class="admin-link" id="btn-admin-open">🔐 Admin</button>
    </div>
  </div>

  <!-- ── SCREEN: Player Dashboard ── -->
  <div id="screen-dash" class="screen">
    <header class="dash-header">
      <button class="back-btn" id="btn-back">←</button>
      <div class="dash-header-info">
        <span id="dash-name" class="dash-name"></span>
        <span id="dash-comp-name" class="dash-comp-badge"></span>
      </div>
      <div class="dash-header-right"></div>
    </header>
    <div class="dash-body">

      <!-- Winner banner -->
      <div id="winner-banner" class="winner-banner" style="display:none;"></div>

      <div class="stat-row">
        <div class="stat-card accent">
          <div class="stat-label">SALES / HR</div>
          <div class="stat-value" id="stat-sph">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">TOTAL SALES</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">RANK</div>
          <div class="stat-value" id="stat-rank">—</div>
        </div>
      </div>

      <!-- Goals section -->
      <div id="dash-goals" class="dash-goals" style="display:none;"></div>

      <div class="vibe-card" id="vibe-card">
        <span id="vibe-emoji">🔥</span>
        <span id="vibe-text">Log your first order to get started!</span>
      </div>
      <div class="log-card">
        <div class="log-card-title">LOG AN ORDER</div>
        <div class="day-row" id="day-row"></div>
        <div class="log-fields">
          <div class="log-field-wrap">
            <label class="field-label">SALES ($)</label>
            <input type="number" id="input-sales" class="log-input" placeholder="0.00" min="0" step="0.01" inputmode="decimal" />
          </div>
          <div class="log-field-wrap">
            <label class="field-label">HOURS WORKED</label>
            <input type="number" id="input-hours" class="log-input" placeholder="0.0" min="0" step="0.5" inputmode="decimal" />
          </div>
        </div>
        <button class="log-btn" id="btn-log">+ LOG IT</button>
      </div>
      <div class="history-wrap">
        <div class="history-title">MY LOGS</div>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="dash" id="nav-dash">📊 My Stats</button>
      <button class="nav-btn" data-tab="board" id="nav-board">🏆 Board</button>
      <button class="nav-btn" data-tab="alltime" id="nav-alltime">⭐ All-Time</button>
    </nav>
  </div>

  <!-- ── SCREEN: Leaderboard ── -->
  <div id="screen-board" class="screen">
    <header class="dash-header">
      <button class="back-btn" id="btn-back-board">←</button>
      <div class="dash-header-info">
        <span class="dash-name">LEADERBOARD</span>
        <span id="board-comp-badge" class="dash-comp-badge"></span>
      </div>
      <div class="dash-header-right"></div>
    </header>
    <div class="board-body" id="board-body"></div>
    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="dash" id="nav-dash-2">📊 My Stats</button>
      <button class="nav-btn active" data-tab="board" id="nav-board-2">🏆 Board</button>
      <button class="nav-btn" data-tab="alltime" id="nav-alltime-2">⭐ All-Time</button>
    </nav>
  </div>

  <!-- ── SCREEN: All-Time ── -->
  <div id="screen-alltime" class="screen">
    <header class="dash-header">
      <button class="back-btn" id="btn-back-alltime">←</button>
      <div class="dash-header-info">
        <span class="dash-name">ALL-TIME</span>
        <span class="dash-comp-badge">Across all competitions</span>
      </div>
      <div class="dash-header-right"></div>
    </header>
    <div class="board-body" id="alltime-body"></div>
    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="dash" id="nav-dash-3">📊 My Stats</button>
      <button class="nav-btn" data-tab="board" id="nav-board-3">🏆 Board</button>
      <button class="nav-btn active" data-tab="alltime" id="nav-alltime-3">⭐ All-Time</button>
    </nav>
  </div>

  <!-- ── MODAL: Admin ── -->
  <div id="modal-admin" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title">🔐 ADMIN</div>

      <!-- PIN gate -->
      <div id="admin-pin-wrap">
        <p class="modal-sub">Enter your PIN to continue</p>
        <input type="number" id="input-pin" class="log-input center" placeholder="1234" maxlength="4" inputmode="numeric" />
        <button class="log-btn" id="btn-pin-submit" style="margin-top:10px;">UNLOCK</button>
        <p class="pin-error hidden" id="pin-error">Wrong PIN, bestie 😬</p>
      </div>

      <!-- Admin panel -->
      <div id="admin-panel" class="hidden">
        <!-- Tab bar -->
        <div id="admin-tab-bar" class="admin-tab-bar"></div>
        <!-- Tab content -->
        <div id="admin-tab-content" class="admin-tab-content"></div>
        <button class="close-btn" id="btn-admin-close">DONE</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
